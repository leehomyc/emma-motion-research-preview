</style><main><h1>五分钟对话，听最后两问</h1>
<p>同一位来电者在通话中改了集合地点和时间。这里保留每次通话最后连续的 35 秒，包括停顿和双方说话重叠的部分。先听票面该印几点，再听最后去哪里集合。</p>
<section><h2>行程一</h2><p>来电者最终确定在十一点去花园。</p>

<label for="a2">加入对话历史的实验版</label><audio id="a2" controls preload="metadata" src="outing-1-planner.m4a"></audio></section>
<section><h2>行程二</h2><p>来电者最终确定在三点去图书馆。</p>
<label for="b1">当前线上语音模型</label><audio id="b1" controls preload="metadata" src="outing-2-original.m4a"></audio>
<label for="b2">加入对话历史的实验版</label><audio id="b2" controls preload="metadata" src="outing-2-planner.m4a"></audio></section>
<p>两版都由 Moshiko 生成回答的声音。实验版由 Qwen 根据截至当时的来电转写，提供要说的文字。语音中偶尔会听到模型声称发了提醒，这套实验没有发送提醒的功能。</p>
