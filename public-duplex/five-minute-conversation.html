<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五分钟英语通话对照</title>
<style>body{font:1.05rem/1.55 system-ui,sans-serif;max-width:43rem;margin:2rem auto;padding:0 1rem;background:#f7f8f5;color:#17241b}h1{line-height:1.2;font-size:clamp(1.6rem,6vw,2.3rem)}label{display:block;font-weight:600;margin:1.4rem 0 .35rem}select,button{font:inherit;padding:.5rem .75rem;border:1px solid #9ca89c;border-radius:.4rem;background:white;color:inherit}audio{width:100%;margin:.75rem 0}nav{display:flex;flex-wrap:wrap;gap:.5rem}small{color:#455546}</style>
<main><h1>五分钟英语通话对照</h1><p><a href="https://advancement-sympathy-delays-itself.trycloudflare.com/?history=direct&amp;head=native-calm&amp;lips=contour">打开实时头肩对话（英语）</a></p><p>同一位合成来电者分 17 轮安排寄件，中途更改城市和取件日。两版收到相同的文字答案；每句话交给语音模型的时刻也相同。</p>
<label for="version">语音版本</label><select id="version"><option value="semantic-parcel-full.mp3">文字和语音提示</option><option value="semantic-parcel-text.mp3">仅文字提示</option></select>
<audio id="call" controls preload="metadata" src="semantic-parcel-full.mp3"></audio>
<nav aria-label="跳到问题"><button data-t="37.5">0:38 · 第一个城市</button><button data-t="73.5">1:14 · 箱子里装什么</button><button data-t="179.5">3:00 · 总运费</button><button data-t="196.5">3:17 · 更正前的地址</button></nav>
<p>切换版本会保留播放位置。可以听一听，助手停顿多久才说到答案，答完后有没有多说一句。</p><small>语音提示由开源 Pocket TTS 根据文字生成。Moshiko 接收第一组 Mimi 语音编码，其余七组由自身生成。本页是录音回放。</small></main>
<script>
const call=document.getElementById("call"), version=document.getElementById("version");
let restore=null;
version.onchange=()=>{restore={time:call.currentTime,play:!call.paused};call.src=version.value;call.load()};
call.addEventListener("loadedmetadata",()=>{if(!restore)return;const state=restore;restore=null;call.currentTime=Math.min(state.time,call.duration);if(state.play)call.play().catch(()=>{})});
for(const btn of document.querySelectorAll("button"))btn.onclick=()=>{call.currentTime=Number(btn.dataset.t);call.play().catch(()=>{})};
</script></html>
