<h1>转头时怎样保持同一张脸</h1>
<p>同一虚构肖像和左右转头轨迹，生成 189 帧。左侧定时补入参考图，右侧优先等脸接近正面再补入。</p>
<section aria-label="参考图刷新时机对照">
<figure><figcaption>定时刷新</figcaption><video controls playsinline muted preload="metadata" src="fixed.mp4"></video></figure>
<figure><figcaption>按头部姿态刷新</figcaption><video controls playsinline muted preload="metadata" src="pose-aware.mp4"></video></figure>
</section>
<p>在这组样片中，最后四分之一的转头轨迹相关性从 0.85 到 0.99，平均脸部相似度都约为 0.89。按姿态刷新时，个别帧仍有明显漂移。</p>
