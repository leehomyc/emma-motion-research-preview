<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整帧扩散的头肩动作测试</title>
<style>html{color-scheme:dark}body{margin:30px auto;padding:0 18px;max-width:980px;font:1rem/1.6 system-ui;color:#f4f4f4;background:#171819}h1{font-size:clamp(1.6rem,5vw,2.4rem)}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}figure{margin:0}figcaption{margin-bottom:6px}video{display:block;width:100%;border-radius:8px}</style>
</head>
<body>
<h1>整帧扩散的头肩动作测试</h1>
<p>同一个虚构肖像，给 Wan-Fun 输入不同的骨架轨迹。每段约三秒，离线生成，无语音。对照右侧延迟一秒的点头和静止输入，可观察动作是否跟随指令。活动幅度较大时，面部身份仍有漂移。</p>
<section aria-label="点头时间对照">
<figure><figcaption>按时点头</figcaption><video controls playsinline preload="metadata" src="pitch.mp4"></video></figure>
<figure><figcaption>点头延迟一秒</figcaption><video controls playsinline preload="metadata" src="pitch_shift1s.mp4"></video></figure>
<figure><figcaption>静止姿态</figcaption><video controls playsinline preload="metadata" src="neutral.mp4"></video></figure>
</section>
<h2>转头、歪头与耸肩</h2>
<section aria-label="三种头肩动作">
<figure><figcaption>左右转头</figcaption><video controls playsinline preload="none" src="yaw.mp4"></video></figure>
<figure><figcaption>左右歪头</figcaption><video controls playsinline preload="none" src="roll.mp4"></video></figure>
<figure><figcaption>耸肩</figcaption><video controls playsinline preload="none" src="shrug.mp4"></video></figure>
</section>
</body>
</html>
