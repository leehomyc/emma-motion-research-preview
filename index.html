<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131517">
  <title>Emma 语音与口型实验</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#f3f1eb;background:#131517;font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{width:min(100% - 2rem,58rem);margin:clamp(1.3rem,4vw,3.6rem) auto}
    h1{font-size:clamp(1.7rem,4vw,2.65rem);line-height:1.15;letter-spacing:-.04em;margin:0 0 .55rem}
    p{margin:0 0 1.2rem;color:#d0d3d1}
    figure{margin:0;padding:0;background:#222526;border-radius:.75rem;overflow:hidden}
    video{display:block;width:100%;max-width:704px;height:auto;margin:auto;background:#222526}
    figcaption{padding:.8rem 1.2rem;color:#dde1de;font-size:.94rem;border-top:1px solid #373a3b}
    details{margin-top:1rem;border-bottom:1px solid #343839;padding:0 0 .7rem}summary{cursor:pointer;color:#bce4d3}
    details p{margin:.6rem 0 0}a{color:#bce4d3;text-underline-offset:3px}
    nav{margin-top:1rem}a:focus-visible,summary:focus-visible{outline:2px solid #bce4d3;outline-offset:3px}
  </style>
</head>
<body>
  <main id="reply">
    <h1>Emma 语音与口型实验</h1>
    <p>播放 7.84 秒的问答样片，观察回答时的嘴部动作。</p>
    <figure>
      <video controls playsinline preload="metadata" width="704" height="640" poster="mouth-preview.jpg" aria-label="参考帧与生成口型的问答样片">
        <source src="mouth-reply.mp4" type="video/mp4">
      </video>
      <figcaption>704 × 640。头部和背景来自一张 Emma 参考帧，嘴部随模型生成的回答变化。</figcaption>
    </figure>
    <details>
      <summary>输入与模型输出</summary>
      <p>输入语音：“What is two plus three?”</p>
      <p>Moshika 输出：“Hey, how can I help you? The sum of 2 and 3 is 5.”</p>
      <p>口型由 Wav2Lip 生成，并用 Emma 演示片段微调。页面播放已生成的问答。</p>
    </details>
    <nav id="replay"><a href="baseline.html">查看早期 88 × 80 表情模型的对比</a></nav>
  </main>
</body>
</html>
